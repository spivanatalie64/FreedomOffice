<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B73E8"/>
      <stop offset="100%" style="stop-color:#1557B0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#107C10"/>
      <stop offset="50%" style="stop-color:#D83B01"/>
      <stop offset="100%" style="stop-color:#5C2D91"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" rx="16" fill="url(#bg)"/>
  <text x="80" y="180" font-family="Inter, Segoe UI, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">FreedomOffice</text>
  <text x="80" y="250" font-family="Inter, Segoe UI, sans-serif" font-size="32" font-weight="400" fill="rgba(255,255,255,0.85)">Free. Open. Familiar.</text>
  <rect x="80" y="280" width="160" height="8" rx="4" fill="url(#accent)"/>
  <text x="80" y="350" font-family="Inter, Segoe UI, sans-serif" font-size="22" fill="rgba(255,255,255,0.5)">Fluent Design Edition</text>
</svg>
