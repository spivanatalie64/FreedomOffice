<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B73E8"/>
      <stop offset="100%" style="stop-color:#1557B0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#107C10"/>
      <stop offset="50%" style="stop-color:#D83B01"/>
      <stop offset="100%" style="stop-color:#5C2D91"/>
    </linearGradient>
  </defs>
  <rect width="400" height="200" rx="8" fill="url(#bg)"/>
  <text x="40" y="90" font-family="Inter, Segoe UI, sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">FreedomOffice</text>
  <text x="40" y="125" font-family="Inter, Segoe UI, sans-serif" font-size="16" font-weight="400" fill="rgba(255,255,255,0.85)">Free. Open. Familiar.</text>
  <rect x="40" y="140" width="80" height="4" rx="2" fill="url(#accent)"/>
  <text x="40" y="175" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)">Fluent Design Edition</text>
</svg>
