<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 72" width="420" height="72">
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/"
             xmlns:xmp="http://ns.adobe.com/xap/1.0/">
      <rdf:Description rdf:about="">
        <dc:creator>Natalie Spiva - AcreetionOS Project</dc:creator>
        <dc:rights>Natalie Spiva - AcreetionOS Project</dc:rights>
        <xmp:AttributionName>Natalie Spiva - AcreetionOS Project</xmp:AttributionName>
        <dc:description>FreedomOffice branding asset - The free and open office suite</dc:description>
        <xmp:CreatorTool>Natalie Spiva - AcreetionOS Project Art Generator</xmp:CreatorTool>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
  <defs>
    <linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a6bd8"/>
      <stop offset="100%" stop-color="#185ABD"/>
    </linearGradient>
  </defs>

  <!-- MS Office-style icon -->
  <rect x="0" y="0" width="72" height="72" rx="16" ry="16" fill="url(#logoBg)"/>

  <!-- White stylized "F" -->
  <g transform="translate(36, 36)" fill="#ffffff">
    <rect x="-18" y="-28" width="14" height="56" rx="4" ry="4"/>
    <rect x="-18" y="-28" width="32" height="12" rx="4" ry="4"/>
    <rect x="-18" y="-2" width="26" height="12" rx="4" ry="4"/>
  </g>

  <!-- Subtle diagonal accent -->
  <line x1="8" y1="56" x2="64" y2="16" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.15"/>

  <!-- "FreedomOffice" wordmark - white for inverted (dark background) -->
  <text x="88" y="42" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="600" fill="#ffffff" letter-spacing="-0.3">FreedomOffice</text>

  <!-- Credit line -->
  <text x="410" y="68" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="5.5" fill="rgba(255,255,255,0.35)" text-anchor="end" font-weight="300">Natalie Spiva - AcreetionOS Project</text>
</svg>
